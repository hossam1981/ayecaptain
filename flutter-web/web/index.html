<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F2A44">
  <meta name="description" content="Bayside — Flutter Web preview">
  <title>Bayside — Flutter preview</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0F2A44; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; background: #0F2A44; }
    #splash .tag { opacity: .8; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="splash">
    <div style="text-align:center">
      <div style="font-size:28px;font-weight:700">Bayside</div>
      <div class="tag">Flutter Web preview — loading…</div>
    </div>
  </div>
  <script>
    // hide the splash once Flutter has rendered its first frame
    window.addEventListener('flutter-first-frame', () => {
      const s = document.getElementById('splash');
      if (s) s.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
