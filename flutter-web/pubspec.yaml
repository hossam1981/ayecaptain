name: bayside_flutter
description: Bayside — Flutter Web preview (a starter skeleton on the `flutter` branch to test the Flutter path without disturbing the live PWA on `main`).
publish_to: none
version: 0.3.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.2.2
  wakelock_plus: ^1.2.10   # Screen Wake Lock — same fix as the PWA (Android throttles GPS when screen sleeps)
  shared_preferences: ^2.3.2   # boat profile persistence (name/limits/tank/burn), works on web + mobile
  web: ^1.0.0   # beforeinstallprompt interop (dart:js_interop) — dart:html is being dropped from stable Flutter
  maplibre_gl: ^0.27.1   # real 3D camera (pitch/bearing) for the nav-only view — needs Flutter 3.29+/Dart 3.7+ (bumped above)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/land-njny.json   # pre-baked NOAA land polygons, shared with the PWA
    # Pre-baked marina/slipway dock data (2,147 points for NJ+NY), extracted offline from
    # Geofabrik's regional OSM files — not a live API call. Added because the live Overpass
    # API fetchDocks() used to depend on exclusively is currently broken (confirmed via direct
    # requests, a backend proxy with a proper identifying header, and Overpass's own official
    # web tool all failing the same way), and NOAA's equivalent chart-facility data has
    # essentially no coverage here (checked: 0 points in NJ/NY, ~1,150 nationwide total). See
    # fetchDocks() in main.dart — this is the fast path; the original live Overpass call is
    # kept as a fallback for locations outside NJ/NY, where this bundled data has nothing.
    - assets/docks-njny.json
    - assets/icons/boat.png
    - assets/icons/boat-3d.png
    # Pre-scaled (LANCZOS, offline) to 3x the 31x76 display size. flutter_web's CanvasKit
    # renderer has a long-standing, still-open quality bug downscaling images at runtime
    # (flutter/flutter#80520, #135655) — even FilterQuality.high washes the ~3.4x runtime
    # downscale of the full 106x260 source out to near-uniform pale colors. Shipping an
    # asset that's already close to its display size sidesteps the bug entirely.
    - assets/icons/boat_small.png
    - assets/icons/boat-3d_small.png
    - assets/icons/mob-buoy.png
    - assets/icons/sunrise.png
    - assets/icons/sunset.png
    - assets/icons/ocean.png
    # Condition icon set (Clear/Partly Cloudy/Cloudy/Rain/Snow/Thunder) — generated to match a
    # glossy-3D cloud icon style the user liked, replacing both the earlier photorealistic
    # sun/partly-cloudy/rain assets (different style, inconsistent with the metric icons below)
    # and the plain emoji fallbacks previously used for cloudy/snow/thunder. Verified genuinely
    # transparent the same way as the metric icons. Fog still falls back to an emoji (🌫️) — not
    # part of this set; night still uses the existing moon photo, untouched.
    - assets/icons/wx_clear.png
    - assets/icons/wx_partly_cloudy.png
    - assets/icons/wx_cloudy.png
    - assets/icons/wx_rain.png
    - assets/icons/wx_snow.png
    - assets/icons/wx_thunder.png
    - assets/icons/wx_moon_full.png
    - assets/icons/wx_moon_half.png
    # Weather-metric icons (Wind/Gust/Sunset/Water/Wave/Period row) — user-supplied, verified
    # genuinely transparent via direct alpha sampling (not preview-tool trust, which has been
    # unreliable before in this project), auto-cropped to content bbox and pre-scaled to 128px
    # square (same CanvasKit-downscale-quality reasoning as the boat icons above).
    - assets/icons/wx_wind.png
    - assets/icons/wx_gust.png
    - assets/icons/wx_sunset.png
    - assets/icons/wx_water.png
    - assets/icons/wx_wave.png
    - assets/icons/wx_period.png
    # Dock-popup icons (same glossy icy-cyan style, user-supplied, verified genuinely
    # transparent) — used in _openDockCallout's icon tile. No matching marina icon yet; that
    # kind still falls back to a plain Icons.anchor glyph.
    - assets/icons/dock_ramp.png
    - assets/icons/dock_fuel.png
