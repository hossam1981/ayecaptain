# This netlify.toml only takes effect on the `flutter` branch. On `main`, the netlify.toml
# there says `publish = "."` and no build command — the PWA is served as static files.
# Netlify uses whichever netlify.toml is on the branch it's deploying, so the two coexist cleanly.

[build]
  base = "flutter-web"
  publish = "build/web"
  # Install Flutter from GitHub into the build sandbox, then build web. Netlify caches node_modules
  # by default but not this — first build takes ~4-6 min, subsequent builds re-clone (unavoidable on
  # Netlify's build image). Fine for a preview branch.
  command = """
    set -e
    if [ ! -d "$HOME/flutter" ]; then
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
    fi
    export PATH="$PATH:$HOME/flutter/bin"
    flutter --disable-analytics >/dev/null 2>&1 || true
    flutter config --enable-web
    flutter --version
    flutter pub get
    # Map keys live in flutter-web/.env locally. On Netlify, set CARTO_KEY and
    # MAPLIBRE_STYLE_URL as site env vars — they are compiled in here. A checked-out
    # .env wins when the file is present.
    BUILD_ARGS=(--release --pwa-strategy=offline-first)
    if [ -f .env ]; then
      BUILD_ARGS+=(--dart-define-from-file=.env)
    else
      if [ -n "${CARTO_KEY:-}" ]; then
        BUILD_ARGS+=(--dart-define="CARTO_KEY=${CARTO_KEY}")
      fi
      if [ -n "${MAPLIBRE_STYLE_URL:-}" ]; then
        BUILD_ARGS+=(--dart-define="MAPLIBRE_STYLE_URL=${MAPLIBRE_STYLE_URL}")
      fi
    fi
    # --pwa-strategy=offline-first (was =none): Chrome requires an active service worker
    # with a fetch handler before it will ever fire beforeinstallprompt, so the "Add to home
    # screen" feature needs one. Known tradeoff, accepted deliberately: the service worker
    # caches aggressively, so after every push you likely need to manually clear the
    # browser's cached images/files (or hard-reload twice) to see the new build — same as
    # the PWA on `main` already requires. `none` avoided this but made install() impossible.
    flutter build web "${BUILD_ARGS[@]}"
  """

# Cache directives so returning visitors don't hard-refresh the whole bundle every reload
[[headers]]
  for = "/*.js"
  [headers.values]
    # Preview branch iterates fast — don't cache JS forever. Netlify's ETag revalidates in ~1 s.
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
